    <style>
        :root {
            --gold: #D4AF37;
            --dark-gold: #996515;
            --bg: #050505;
            --card-bg: rgba(20, 20, 20, 0.9);
            --glow: rgba(212, 175, 55, 0.4);
        }

        * { box-sizing: border-box; scroll-behavior: smooth; }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* 8D ANIMATED BACKGROUND */
        .bg-glow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #050505 100%);
            z-index: -1;
        }

        .container { max-width: 1400px; margin: auto; padding: 20px; }

        header {
            text-align: center;
            padding: 80px 20px;
            border-bottom: 1px solid var(--gold);
            background: linear-gradient(to bottom, rgba(212,175,55,0.1), transparent);
            border-radius: 0 0 50px 50px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 8vw, 4rem);
            margin: 0;
            background: linear-gradient(to right, #fff, var(--gold), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 5px;
        }

        /* SEARCH SYSTEM */
        .search-container {
            margin: 40px auto;
            max-width: 600px;
            position: relative;
        }

        #serviceSearch {
            width: 100%;
            padding: 15px 25px;
            border-radius: 50px;
            border: 1px solid var(--gold);
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 1.1rem;
            outline: none;
            box-shadow: 0 0 15px var(--glow);
        }

        /* 8D MULTI-STYLE GRID */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            padding: 20px 0;
        }

        .service-card {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 30px;
            border-radius: 20px;
            transition: 0.5s;
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .service-card:hover {
            border-color: var(--gold);
            transform: scale(1.05) rotateY(10deg);
            box-shadow: 0 10px 40px rgba(212, 175, 55, 0.2);
        }

        .service-card i {
            font-size: 2.5rem;
            color: var(--gold);
            margin-bottom: 20px;
            display: block;
        }

        .service-card h3 {
            font-family: 'Orbitron', sans-serif;
            color: var(--gold);
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .service-card p {
            font-size: 0.9rem;
            color: #ccc;
            line-height: 1.5;
        }

        /* FLOATING CHATBOT */
        .bot-link {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 70px;
            height: 70px;
            background: var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px var(--glow);
            z-index: 1000;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(212, 175, 55, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        footer {
            text-align: center;
            padding: 100px 20px;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
        }

        .social-icons a {
            color: var(--gold);
            font-size: 2rem;
            margin: 0 20px;
            transition: 0.3s;
        }

        .social-icons a:hover { color: #fff; text-shadow: 0 0 20px var(--gold); }

    </style>
</head>
